# splat config for rel_cardalbum.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x006F08  .text                    (0x6EB4)
#   0x006F08-0x00A548  .sceStub.text            (0x3640)
#   0x00A548-0x00A54C  .lib.ent.top             (0x4)
#   0x00A54C-0x00A56C  .lib.ent                 (0x20)
#   0x00A56C-0x00A570  .lib.ent.btm             (0x4)
#   0x00A570-0x00A574  .lib.stub.top            (0x4)
#   0x00A574-0x00A5A0  .lib.stub                (0x2C)
#   0x00A5A0-0x00A5A4  .lib.stub.btm            (0x4)
#   0x00A5A4-0x00A5D8  .rodata.sceModuleInfo    (0x34)
#   0x00A5D8-0x00A630  .rodata.sceResident      (0x58)
#   0x00A630-0x00C164  .rodata.sceNid           (0x1B34)
#   0x00C164-0x00CAC4  .data                    (0x960)
#   0x00CAC4-0x0107EC  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x107EC == 67564 == the file's exact size.

name: rel_cardalbum
sha1: bfa112b2549a8a023c1ee550fa44ce7b458e1630
options:
  platform: psp
  basename: rel_cardalbum
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_cardalbum.prx
  asm_path: asm/rel_cardalbum
  ld_script_path: build/rel_cardalbum.ld
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_cardalbum
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x6EB4: the code to decompile
      - [0x6F08, asm, sceStub_text]  # vram 0x6EB4-0xA4F4: import-stub trampolines
      - [0xA548, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0xA5A4, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0xA630, bin, sceNid]   # .rodata.sceNid
      - [0xC164, bin, data]   # .data
      - [0xCAC4, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x107EC]   # sentinel: total file size
