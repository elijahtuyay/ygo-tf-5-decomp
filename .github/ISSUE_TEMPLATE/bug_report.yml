name: Bug report
description: A problem with the tooling, scripts, or documentation.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Environment (OS, tool versions)
